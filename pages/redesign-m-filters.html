body{margin:0}*{box-sizing:border-box}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cc{display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}

.cc .ph{transition:transform .4s}.cc:hover .ph{transform:scale(1.04)}
.phw{overflow:hidden;position:relative}
.ph{background-size:cover;background-position:center;background-color:#E7ECF4}
.mut{color:var(--muted)}
.mon{color:var(--blue);font-weight:800;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.tg{background:var(--green-soft);color:var(--green)}
.tb{background:var(--blue-soft);color:var(--blue)}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.track{position:relative;height:8px;border-radius:99px;background:#DDE3EE}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue)}
.track>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 2px 8px rgba(15,42,61,.25)}
.in{width:100%;border:1.5px solid #CFD7E4;border-radius:12px;padding:12px 14px;font:15px "Noto Sans Georgian",sans-serif;min-height:48px;background:#fff;color:var(--ink)}
.sel{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #CFD7E4;border-radius:12px;padding:0 14px;min-height:46px;background:#fff;font-weight:600}
.ck{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--green-soft);color:var(--green);align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.ft a:hover{color:#fff}
.h1{font-size:54px;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:0}
.h2{font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:0}
</style></helmet>
